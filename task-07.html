<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO Th07</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sheet">
      <nav class="month-menu" aria-label="Month menu">
        <a href="index.html" class="month-link">Following</a>
        <a href="task-07.html" class="month-link active" aria-current="page"
          >Th07</a
        >
        <a href="task-08.html" class="month-link">Th08</a>
        <a href="#" class="month-link">Th09</a>
        <a href="#" class="month-link">Th10</a>
        <a href="#" class="month-link">Th11</a>
        <a href="#" class="month-link">Th12</a>
        <a href="task-year.html" class="month-link">ALL</a>
      </nav>

      <div class="title-row">
        <span class="sparkle left">✦</span>
        <span class="sparkle middle0">✦</span>
        <h1 id="mainTitle"></h1>
        <span class="sparkle middle1">✦</span>
        <span class="sparkle right">✦</span>
      </div>

      <section id="dailySection">
        <div class="section-heading-row">
          <h2 class="section-heading" id="dailyHeading"></h2>
          <button
            type="button"
            class="new-button new-todo-button"
            data-todo-section="daily"
          >+</button>
        </div>
        <div class="annual-cols">
          <div class="annual-block" id="dailyLeft"></div>
          <div class="annual-block" id="dailyRight"></div>
        </div>
      </section>

      <section id="trackingSection">
        <div class="section-heading-row">
          <h2 class="section-heading" id="trackingMonthHeading"></h2>
          <button
            type="button"
            class="new-button new-tracking-button"
            id="newTrackingButton"
            data-tracking-section="tracking_month"
          >
            +
          </button>
        </div>
        <div class="task-grid" id="trackingMonthGrid"></div>
      </section>

      <dialog class="tracking-dialog" id="newTrackingDialog">
        <form method="dialog" id="newTrackingForm">
          <div class="dialog-header">
            <h3>New tracking</h3>
            <button
              type="button"
              class="dialog-close"
              id="closeTrackingDialog"
              aria-label="Close"
            >
              &times;
            </button>
          </div>
          <label for="newTrackingTitle">Title</label>
          <input
            type="text"
            id="newTrackingTitle"
            name="title"
            maxlength="255"
            required
          />
          <p class="form-error" id="newTrackingError" role="alert"></p>
          <button type="submit" class="submit-button">Submit</button>
        </form>
      </dialog>

      <dialog class="tracking-dialog" id="newTodoDialog">
        <form method="dialog" id="newTodoForm">
          <div class="dialog-header">
            <h3 id="newTodoDialogTitle">New todo</h3>
            <button
              type="button"
              class="dialog-close"
              id="closeTodoDialog"
              aria-label="Close"
            >
              &times;
            </button>
          </div>
          <label for="newTodoLetter">Letter</label>
          <input type="text" id="newTodoLetter" name="letter" maxlength="255" required />
          <label for="newTodoTitle">Title</label>
          <input type="text" id="newTodoTitle" name="title" maxlength="255" required />
          <label class="checkbox-label" for="newTodoIsLeft">
            <input type="checkbox" id="newTodoIsLeft" name="isLeft" />
            Is left
          </label>
          <p class="form-error" id="newTodoError" role="alert"></p>
          <button type="submit" class="submit-button">Submit</button>
        </form>
      </dialog>

      <section id="weeklySection">
        <div class="section-heading-row">
          <h2 class="section-heading" id="weeklyHeading"></h2>
          <button type="button" class="new-button" id="newWeeklyButton">
            +
          </button>
        </div>
        <table class="weekly">
          <thead>
            <tr id="weeklyHeaderRow"></tr>
          </thead>
          <tbody id="weeklyCategoryRow"></tbody>
        </table>
      </section>

      <dialog class="tracking-dialog" id="newWeeklyDialog">
        <form method="dialog" id="newWeeklyForm">
          <div class="dialog-header">
            <h3>New weekly task</h3>
            <button
              type="button"
              class="dialog-close"
              id="closeWeeklyDialog"
              aria-label="Close"
            >
              &times;
            </button>
          </div>
          <label for="newWeeklyWeek">Week</label>
          <select id="newWeeklyWeek" name="week" required>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
          <label for="newWeeklyDay">Day of week</label>
          <select id="newWeeklyDay" name="dayOfWeek" required>
            <option value="0">MON</option>
            <option value="1">TUE</option>
            <option value="2">WED</option>
            <option value="3">THUR</option>
            <option value="4">FRI</option>
            <option value="5">SAT</option>
            <option value="6">SUN</option>
          </select>
          <label for="newWeeklyTitle">Title</label>
          <input
            type="text"
            id="newWeeklyTitle"
            name="title"
            maxlength="255"
            required
          />
          <p class="form-error" id="newWeeklyError" role="alert"></p>
          <button type="submit" class="submit-button">Submit</button>
        </form>
      </dialog>

    </div>

    <script src="js/content-07.js"></script>
    <script src="js/data.js"></script>
    <!-- common -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db/env.js"></script>
    <script src="js/db/todo-list.js"></script>
    <script src="js/db/tracking.js"></script>
    <script src="js/db/weekly.js"></script>
    <script src="js/schedule-app.js"></script>
  </body>
</html>
